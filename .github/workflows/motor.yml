# Motor de Radar Explica: detector de olas + portadas de Shorts, cada 30 min de 06:00 a 00:00 de Chile (11-nov-2026).
# Corre en este repo público porque aquí los minutos de GitHub Actions son gratis. El código y los datos NO están aquí:
# se bajan del repo privado con la llave de despliegue RADAR_REPO_KEY y los resultados se suben de vuelta allá.
# Secretos de este repo: RADAR_REPO_KEY (ya existía), YOUTUBE_TOKEN_JSON, YOUTUBE_CLIENT_SECRET_JSON y PANEL_CLAVE (la
# clave del panel en vivo docs/olas/, cifrado: sin la clave la página publicada no se puede leer).
name: Motor (olas y portadas)
on:
  schedule:
    - cron: "5,35 9-23 * * *"
    - cron: "5,35 0-2 * * *"
  workflow_dispatch:
    inputs:
      semanal:
        description: "Correr también el aprendizaje semanal (modelo y calibración): si / no"
        default: "no"
permissions:
  contents: write
concurrency:
  group: motor
  cancel-in-progress: false
jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: publico
      - name: Llave del repo privado
        env:
          RADAR_REPO_KEY: ${{ secrets.RADAR_REPO_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RADAR_REPO_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: Baja solo lo que usa el motor
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse git@github.com:panchotroncoso-commits/radar-explica.git privado
          cd privado
          git sparse-checkout set --no-cone /radar/ /publicacion/ /pieza.py /data/panel/ /data/olas/ /data/metricas/ \
            /data/publicaciones.csv /data/aprendizaje/ /pieza.py '/publicadas/*/*/meta.json' '/publicadas/*/*/portada.png' \
            '/contenido/*/meta.json' '/contenido/*/portada.png' /assets/marca/tokens.css
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow python-dotenv google-api-python-client google-auth-oauthlib google-auth-httplib2 cryptography
      - name: Portadas
        working-directory: privado
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          python -m publicacion.miniaturas --dias 1 || true
          mkdir -p data/olas
          python -m publicacion.rescate candidatos > data/olas/rescate.json || echo "[]" > data/olas/rescate.json
          echo "Candidatos a rescate: $(python -c "import json; print(len(json.load(open('data/olas/rescate.json'))))")"
      - name: Detector
        working-directory: privado
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TZ: America/Santiago
        run: |
          python -m radar.fuentes.sobrerendimiento --json --top 15 > /dev/null
          python -c "import json; r=json.load(open('data/olas/detector.json')); print('Panel', r['canales_leidos'], '/', r['canales_panel'], '· alertas:', len(r.get('alertas_ola', [])))"
      - name: Aprendizaje semanal (lunes, primera corrida)
        working-directory: privado
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          TZ: America/Santiago
        run: |
          if [ "$(date -u +%u%H)" != "109" ] && [ "${{ github.event_name }}" != "workflow_dispatch" -o "${{ github.event.inputs.semanal }}" != "si" ]; then exit 0; fi
          python -m radar.modelo || true
          python -m radar.calibrar --grilla | tail -3 || true
      - name: Sube resultados al repo privado
        working-directory: privado
        run: |
          git config user.name "Radar Explica (motor)"
          git config user.email "radarexplica@gmail.com"
          git add data/panel/mediciones data/panel/base.json data/panel/cobertura.json data/olas/detector.json data/olas/historial.jsonl data/olas/rescate.json
          git add data/aprendizaje/modelo.json data/aprendizaje/modelo-datos.jsonl data/aprendizaje/calibracion.json 2>/dev/null || true
          git commit -qm "Motor $(date +%FT%H:%M)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
          exit 1
      - name: Panel en vivo (cifrado)
        working-directory: privado
        env:
          PANEL_CLAVE: ${{ secrets.PANEL_CLAVE }}
        run: |
          if [ -z "$PANEL_CLAVE" ]; then echo "::warning::Falta el secreto PANEL_CLAVE"; exit 0; fi
          python -m radar.panel_web ../publico/docs/olas/index.html
          cd ../publico
          git config user.name "Radar Explica (motor)"
          git config user.email "radarexplica@gmail.com"
          git add docs/olas/index.html
          git commit -qm "Panel en vivo" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
