# Motor de Radar Explica: detector de olas, portadas, candidatos a rescate y panel en vivo, cada 30 min (11-nov-2026).
# Corre en este repo público porque aquí los minutos de GitHub Actions son gratis. El código y los datos NO están aquí:
# se bajan del repo privado con la llave RADAR_REPO_KEY y los resultados se suben allá (automatizacion/motor_ciclo.sh).
#
# EN CADENA: el horario de GitHub es «lo antes posible» y con repos chicos pasa horas sin disparar (11-nov: 0 corridas
# programadas en 3 h). Por eso cada corrida da una vuelta cada 30 min durante ~5,5 h y al final lanza la siguiente con
# workflow_dispatch (el GITHUB_TOKEN sí puede). El horario queda solo de respaldo: si la cadena se corta, la revive.
# Fuera de 06:00–00:00 de Chile duerme y no da vueltas.
# Secretos: RADAR_REPO_KEY, YOUTUBE_TOKEN_JSON, YOUTUBE_CLIENT_SECRET_JSON y PANEL_CLAVE (clave del panel docs/olas/).
name: Motor (olas y portadas)
on:
  schedule:
    - cron: "17 */3 * * *"
  push:                      # al cambiar este archivo arranca la cadena de inmediato
    paths: [".github/workflows/motor.yml"]
  workflow_dispatch:
    inputs:
      semanal:
        description: "Correr también el aprendizaje semanal (modelo y calibración): si / no"
        default: "no"
permissions:
  contents: write
  actions: write
concurrency:
  group: motor
  cancel-in-progress: false
jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: publico
      - name: Llave del repo privado
        env:
          RADAR_REPO_KEY: ${{ secrets.RADAR_REPO_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$RADAR_REPO_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - name: Baja solo lo que usa el motor
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse git@github.com:panchotroncoso-commits/radar-explica.git privado
          cd privado
          git sparse-checkout set --no-cone /radar/ /publicacion/ /pieza.py /automatizacion/motor_ciclo.sh /data/panel/ \
            /data/olas/ /data/metricas/ /data/publicaciones.csv /data/aprendizaje/ /data/temprano/ /data/pauta/ /data/retro/ \
            '/publicadas/*/*/meta.json' '/publicadas/*/*/portada.png' '/contenido/*/meta.json' '/contenido/*/guion.json' \
            '/contenido/*/portada.png' '/contenido/*/empaque_b.json' '/contenido/*/portada-b*.png' \
            '/publicadas/*/*/empaque_b.json' '/publicadas/*/*/portada-b*.png' /assets/marca/tokens.css
          git config user.name "Radar Explica (motor)"
          git config user.email "radarexplica@gmail.com"
          cd ../publico
          git config user.name "Radar Explica (motor)"
          git config user.email "radarexplica@gmail.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pillow python-dotenv google-api-python-client google-auth-oauthlib google-auth-httplib2 cryptography
      - name: Vueltas cada 30 min
        working-directory: privado
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          PANEL_CLAVE: ${{ secrets.PANEL_CLAVE }}
          SEMANAL: ${{ github.event.inputs.semanal }}
          TZ: America/Santiago
        run: |
          fin=$(( $(date +%s) + 300*60 ))   # 300 min: deja margen para lanzar la siguiente antes del límite de 350
          while [ "$(date +%s)" -lt "$fin" ]; do
            h=$(date +%H)
            if [ "$h" -ge 6 ]; then
              echo "::group::Vuelta $(date '+%F %H:%M')"
              timeout 25m bash automatizacion/motor_ciclo.sh ../publico || echo "vuelta cortada o con error ($?)"   # una vuelta colgada no mata la cadena (11-nov: 19:35)
              echo "::endgroup::"
              SEMANAL=no
            else
              echo "$(date '+%H:%M') fuera de horario (00–06 Chile): duerme"
            fi
            prox=$(( ( $(date +%s) / 1800 + 1 ) * 1800 + 300 ))   # próximo :05 o :35
            [ "$prox" -ge "$fin" ] && break
            sleep $(( prox - $(date +%s) ))
          done
      - name: Lanza la siguiente vuelta de la cadena
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run motor.yml -R "${{ github.repository }}" -f semanal=no
