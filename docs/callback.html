<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorización · Radar Explica</title><style>:root{--noche:#0B0614;--texto:#fff;--lavanda:#C9B8E8;--calor:#DE4968;--naranja:#FE9F6D}body{margin:0;background:var(--noche);color:var(--texto);font-family:Sora,system-ui,sans-serif}main{max-width:560px;margin:0 auto;padding:56px 20px}h1{font-size:1.8rem;margin:16px 0 8px}p{color:var(--lavanda);line-height:1.6}.btn{display:inline-block;margin-top:24px;background:#fff;color:#000;padding:14px 22px;border-radius:10px;font-weight:600;text-decoration:none}.ok{color:var(--naranja);font-weight:600}code{color:#FCFDBF;word-break:break-all;font-family:"JetBrains Mono",monospace;font-size:.85rem}small{display:block;margin-top:40px;color:#8C7FA8}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap"></head><body><main>
<img src="icono.png" alt="Radar Explica" width="72" height="72" style="border-radius:16px">
<h1 id="t">Cuenta de TikTok conectada</h1>
<p id="d"><span class="ok">Autorización recibida.</span> El publicador de Radar Explica ya puede publicar los videos del canal en esta cuenta. Código para el publicador:</p>
<p><code id="c"></code></p>
</main><script>
const q=new URLSearchParams(location.search);

else{document.getElementById("t").textContent="No se completó la autorización";document.getElementById("d").textContent=q.get("error_description")||"Vuelve a intentarlo desde la página Conectar.";}
</script></body></html>
