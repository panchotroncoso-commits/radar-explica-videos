<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Radar en vivo</title><meta name="theme-color" content="#0B0614"><style>/* Radar Explica — tokens de diseño. Fuente única de verdad para la web y cualquier interfaz.
   Ver DISENO.md para el uso. */
@import url("https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap");

:root {
  color-scheme: dark;

  /* Base */
  --noche: #0B0614;
  --superficie: #17102A;
  --borde: #2A1A45;
  --texto: #FFFFFF;
  --lavanda: #C9B8E8;

  /* Escala térmica continua (frío → ardiendo) */
  --calor-0: #140826;
  --calor-1: #220C45;
  --calor-2: #3B0F70;
  --calor-3: #8C2981;
  --calor-4: #DE4968;
  --calor-5: #FE9F6D;
  --calor-6: #FCFDBF;

  /* Escala de atención (estados) */
  --frio: var(--calor-2);
  --tibio: var(--calor-3);
  --subiendo: var(--calor-4);
  --caliente: var(--calor-5);
  --ardiendo: var(--calor-6);

  /* Series */
  --serie-tema: var(--calor-6);
  --serie-efemeride: var(--calor-3);
  --serie-semana: var(--calor-4);

  /* Tipografía */
  --fuente-titulo: "Sora", "Helvetica Neue", Arial, sans-serif;
  --fuente-texto: "Sora", "Helvetica Neue", Arial, sans-serif;
  --fuente-dato: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --interletra-titulo: -0.04em;

  /* Casillas del mapa de calor */
  --casilla-espacio: 18%;
  --casilla-radio: 6px;
  --radio-chip: 8px;
  --radio-panel: 16px;
}

body {
  background: var(--noche);
  color: var(--texto);
  font-family: var(--fuente-texto);
}

.chip {
  display: inline-block;
  font-family: var(--fuente-titulo);
  font-weight: 800;
  text-transform: uppercase;
  border-radius: var(--radio-chip);
  padding: 0.35em 0.7em;
}
.chip--frio, .chip--tibio, .chip--subiendo { color: var(--texto); }
.chip--caliente, .chip--ardiendo { color: var(--noche); }
.chip--frio { background: var(--frio); }
.chip--tibio { background: var(--tibio); }
.chip--subiendo { background: var(--subiendo); }
.chip--caliente { background: var(--caliente); }
.chip--ardiendo { background: var(--ardiendo); }

.dato {
  font-family: var(--fuente-dato);
  font-weight: 500;
  color: var(--caliente);
}

body{background:var(--noche);color:var(--texto);font-family:var(--fuente-texto);margin:0;padding:24px 16px}
main{max-width:1100px;margin:0 auto}
h1{font-weight:800;letter-spacing:-.04em;margin:0 0 4px;font-size:clamp(30px,6vw,46px)}
h2{font-weight:800;letter-spacing:-.03em;font-size:22px;margin:36px 0 4px}
h3{font-weight:800;letter-spacing:-.02em;font-size:19px;line-height:1.25;margin:4px 0 10px}
.prota{font-family:var(--fuente-dato);color:var(--calor-5);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 0}
.fila-t{display:block;font-size:12px;font-weight:600}.fila-p{display:block;font-family:var(--fuente-dato);font-size:10px;color:var(--lavanda);font-weight:500}
.dato{font-family:var(--fuente-dato);color:var(--lavanda);font-size:12px;margin:4px 0}
.ayuda{color:var(--lavanda);font-size:14px;max-width:720px;margin:0 0 14px;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--superficie);border:1px solid var(--borde);border-radius:14px;padding:16px}
.card-ola{border-color:var(--calor-6)}
.card-top{display:flex;align-items:center;gap:8px}
.pos{font-family:var(--fuente-dato);color:var(--noche);background:var(--lavanda);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.badge{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px}
.badge.ola{background:var(--calor-6);color:var(--noche)}.badge.desc{background:transparent;color:var(--calor-6);border:1px solid var(--calor-6)}.badge.va{background:var(--calor-3);color:#fff}
.pron-motor{font-size:13px;margin:0 0 10px}.pron-motor b{color:var(--texto)}.pron-motor span{color:var(--lavanda);font-size:11px}
.p10k{display:flex;align-items:center;gap:10px;margin:2px 0 10px}.p10k b{font-size:30px;font-weight:800;color:var(--calor-6);letter-spacing:-.03em}
.p10k span{font-size:12px;color:var(--lavanda);line-height:1.3}
.medidor-barra{position:relative;height:10px;background:var(--calor-0);border-radius:5px;margin-top:6px}
.medidor-barra i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.medidor-barra b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--texto)}
.tend{font-size:14px;font-weight:600;margin:10px 0}.tend.sube{color:var(--calor-5)}.tend.baja{color:var(--lavanda)}.tend.nuevo{color:var(--calor-6)}
.barras{margin:8px 0}.bp{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.bp span{width:92px;color:var(--lavanda)}.bp i{height:8px;background:var(--calor-4);border-radius:4px}
.video{display:block;color:var(--texto);font-size:13px;margin-top:10px;line-height:1.35}
.vacio{color:var(--lavanda)}
.dia{list-style:none;margin:0;padding:0;border:1px solid var(--borde);border-radius:14px;overflow:hidden}
.slot{display:grid;grid-template-columns:64px 1fr 190px;gap:16px;align-items:center;padding:14px 16px;border-top:1px solid var(--borde)}
.slot:first-child{border-top:0}
.s-hora{font-family:var(--fuente-dato);font-size:15px;color:var(--lavanda)}
.s-t{font-weight:600;font-size:15px;line-height:1.35}.s-t a{color:var(--texto);text-decoration:none}.s-t a:hover{text-decoration:underline}
.s-t em{font-style:normal;font-family:var(--fuente-dato);font-size:11px;color:var(--calor-6);border:1px solid var(--calor-6);border-radius:4px;padding:0 5px;margin-left:6px}
.s-est{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.s-det{font-family:var(--fuente-dato);font-size:12px;color:var(--lavanda)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.pub{background:var(--calor-5);color:var(--noche)}.pill.prog{background:var(--calor-4);color:#fff}
.pill.prod{background:var(--calor-3);color:#fff}.pill.pend{background:transparent;color:var(--lavanda);border:1px solid var(--borde)}
.pill.manana{background:var(--calor-2);color:#fff}
.pr{display:flex;align-items:center;gap:10px;margin-top:8px}.pr-barra{position:relative;flex:0 0 160px;height:8px;background:var(--calor-0);border-radius:4px}
.pr-barra span{position:absolute;top:0;bottom:0;background:var(--calor-3);border-radius:4px}
.pr-barra i{position:absolute;top:-4px;width:4px;height:16px;margin-left:-2px;background:var(--calor-6);border-radius:2px}
.leyenda-pr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--lavanda);margin:8px 2px 0}
.lp-r{display:inline-block;width:22px;height:8px;border-radius:4px;background:var(--calor-3)}
.lp-m{display:inline-block;width:2px;height:14px;background:var(--texto);margin-left:10px}
.pr-barra b.meta{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--texto);opacity:.8}
.kpi-meta b{color:var(--calor-6)}
.lp-v{display:inline-block;width:4px;height:14px;border-radius:2px;background:var(--calor-6);margin-left:10px}
.pr-txt{font-family:var(--fuente-dato);font-size:11px;color:var(--lavanda)}
@media (max-width:700px){main .kpis{grid-template-columns:repeat(2,1fr);gap:6px}main .kpis div{padding:8px 10px}main .kpis b{font-size:16px}
  main .kpis span{font-size:11px;line-height:1.25;display:block}
  .slot{grid-template-columns:48px 1fr;gap:6px 12px;align-items:start}.s-hora{padding-top:2px}.s-est{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left}
  .pr-barra{flex-basis:120px}}
.hoy{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.hoy li{background:var(--superficie);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:230px 1fr;gap:10px;align-items:center}
.hoy a{color:var(--texto)}.hc-t{font-weight:600;font-size:15px}
.hc-est{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;margin-right:8px}
.hc-est.pub{background:var(--calor-5);color:var(--noche)}.hc-est.prog{background:var(--calor-3);color:#fff}
.hc-est.prod{background:var(--calor-2);color:#fff}.hc-est.enc{background:var(--calor-6);color:var(--noche)}
@media (max-width:700px){.hoy li{grid-template-columns:1fr}}
h3.sub{font-size:15px;letter-spacing:0;margin:18px 0 8px;color:var(--lavanda);font-weight:600}
.tabla-pauta{overflow-x:auto}.tabla-pauta table{border-collapse:collapse;width:100%;min-width:560px}
.tabla-pauta th{text-align:left;font-size:12px;color:var(--lavanda);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--borde)}
.tabla-pauta td{padding:8px;border-bottom:1px solid var(--borde);font-size:14px;vertical-align:top}
.tabla-pauta tr.si td:nth-child(3){color:var(--calor-5);font-weight:600}.tabla-pauta tr.no{opacity:.5}
.tabla-pauta tr.cond td:nth-child(3){color:var(--calor-6)}
.mapa{display:flex;flex-direction:column;gap:4px}
.m-fila{display:grid;grid-template-columns:minmax(150px,260px) 1fr 110px;gap:12px;align-items:center}
.m-tema{min-width:0}.m-tema b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.25}
.m-tema span{display:block;font-family:var(--fuente-dato);font-size:10px;color:var(--lavanda);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-celdas{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.m-celdas .c{display:block;height:26px;border-radius:4px}.m-celdas .c.vacia{background:var(--calor-0);opacity:.35}
.m-horas span{font-family:var(--fuente-dato);font-size:10px;color:var(--lavanda);white-space:nowrap}
.m-cab{margin-bottom:2px}
.m-ver{font-size:12px;color:var(--lavanda);white-space:nowrap}.m-ver.ola{color:var(--calor-6);font-weight:600}.m-ver.va{color:var(--calor-5);font-weight:600}
@media (max-width:700px){.m-fila{grid-template-columns:110px 1fr 64px;gap:8px}.m-tema b{font-size:11px}.m-tema span{display:none}
  .m-celdas{gap:2px}.m-celdas .c{height:20px}.m-ver{font-size:11px;white-space:normal}.m-horas span{font-size:9px}}
.leyenda{display:flex;align-items:center;gap:3px;margin-top:10px}.leyenda i{width:22px;height:10px;border-radius:3px}
.leyenda .dato{margin:0 6px}
.pestanas{display:flex;gap:6px;margin:18px 0 6px}.pestanas button{background:var(--superficie);color:var(--lavanda);border:1px solid var(--borde);
  border-radius:20px;padding:8px 16px;font:600 14px var(--fuente-texto);cursor:pointer}.pestanas button.act{background:var(--calor-5);color:var(--noche);border-color:var(--calor-5)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.kpis div{border-left:2px solid var(--superficie);padding:2px 0 2px 12px;cursor:default}.kpis b{display:block;font-size:20px;font-weight:800}
.kpis span{font-size:12px;color:var(--lavanda)}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:10px 0 18px}
.st-v{display:flex;flex-direction:column;gap:4px;color:inherit;text-decoration:none}.st-v img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px}
.st-v b{font-size:14px;line-height:1.3}.st-v span{font-size:12px;color:var(--lavanda)}
.rango{position:relative;height:12px;background:var(--calor-0);border-radius:6px;min-width:180px;margin-top:4px}
.rango span{position:absolute;top:0;bottom:0;background:var(--calor-3);border-radius:6px}
.rango .real{position:absolute;top:-3px;width:6px;height:18px;margin-left:-3px;background:var(--calor-6);border-radius:3px}
@media (max-width:700px){.tabla-pauta table{min-width:0}.tabla-pauta thead{display:none}
  .tabla-pauta tr,.tabla-pauta td{display:block}.tabla-pauta tr{background:var(--superficie);border-radius:10px;margin:0 0 10px;padding:8px 12px}
  .tabla-pauta td{border:0;padding:3px 0}}
.est-p{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.est-p.ok{background:var(--calor-5);color:var(--noche)}.est-p.bajo{background:var(--calor-2);color:#fff}
.est-p.sobre{background:var(--calor-6);color:var(--noche)}.est-p.neutro{color:var(--lavanda)}
details{margin-top:36px;background:var(--superficie);border-radius:12px;padding:12px 16px}summary{cursor:pointer;font-weight:600}
#entrar{max-width:360px;margin:15vh auto;text-align:center}
#entrar input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid var(--borde);background:var(--superficie);color:var(--texto);font-size:16px}
.campo{position:relative}.campo input{padding-right:48px!important}
#ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto!important;margin:0!important;padding:6px 8px!important;
  background:transparent!important;color:var(--lavanda)!important;font-size:18px!important;cursor:pointer}
#entrar > button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--calor-5);color:var(--noche);font-weight:600;font-size:16px}
#error{color:var(--calor-4);font-size:13px;min-height:18px}
</style></head>

<div class="campo"><input id="c" type="password" placeholder="Clave" autocomplete="current-password" autofocus>
<button type="button" id="ojo" aria-label="Mostrar clave" title="Mostrar clave">👁</button></div>
<button>Entrar</button><p id="error"></p></div></form></main>

async function abrir(clave){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
const llave=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.sal),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.iv)},llave,b(D.ct));return new TextDecoder().decode(t);}
async function entrar(clave,guardar){try{document.querySelector('main').innerHTML=await abrir(clave);
if(guardar){try{localStorage.setItem('radar_clave',clave)}catch(e){}}}catch(e){document.getElementById('error').textContent='Clave incorrecta';}}
document.getElementById('ojo').addEventListener('click',()=>{const c=document.getElementById('c');
const ver=c.type==='password';c.type=ver?'text':'password';document.getElementById('ojo').style.opacity=ver?1:.6;c.focus();});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();entrar(document.getElementById('c').value,true);});
try{const g=localStorage.getItem('radar_clave');if(g)entrar(g,false);}catch(e){}
document.addEventListener('click',e=>{const b=e.target.closest('.pestanas button');if(!b)return;
document.querySelectorAll('.pestanas button').forEach(x=>x.classList.toggle('act',x===b));
document.querySelectorAll('.pestana').forEach(x=>x.hidden=x.id!=='p-'+b.dataset.p);});
setTimeout(()=>location.reload(),15*60*1000);
</script></body></html>
